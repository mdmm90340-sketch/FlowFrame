name: FlowFrame
options:
  minimumXcodeGenVersion: 2.44.1
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: zh-Hans
  knownRegions: [zh-Hans, en, Base]
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
packages:
  FlowFrameCore:
    path: FlowFrameCore
targets:
  FlowFrame:
    type: application
    platform: iOS
    sources:
      - path: FlowFrame
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flowframe.ios
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    dependencies:
      - package: FlowFrameCore
  FlowFrameTests:
    type: bundle.unit-test
    platform: iOS
    sources: [FlowFrameTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flowframe.ios.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: FlowFrame
  FlowFrameUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [FlowFrameUITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flowframe.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: FlowFrame
    dependencies:
      - target: FlowFrame
schemes:
  FlowFrame:
    build:
      targets:
        FlowFrame: all
        FlowFrameTests: [test]
        FlowFrameUITests: [test]
    test:
      targets: [FlowFrameTests, FlowFrameUITests]
      language: zh-Hans
      region: CN
